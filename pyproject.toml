[project]
name = "relatorio-dns-blocky"
version = "0.1.0"
description = "Self-contained HTML report from the Blocky DNS query log: blocked share, devices, hours and blocklist candidates."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ibson Diniz", email = "45883903+ibsondiniz@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
relatorio-dns = "relatorio_dns.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "relatorio_dns"
module-root = ""

[tool.ruff]
line-length = 150

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
